name: Release
# 打 v* tag → 双架构 ipk 发布:
#   1. build: 矩阵(x86_64/aarch64_generic)交叉编译 Go + 构建前端 + 组装 ipk
#   2. release: 双 ipk 挂本仓 Release(GITHUB_TOKEN 同仓写即可)
#   3. attach-to-hub: 回挂到生态主仓 filescodebox/filescodebox 的 Release(tag openwrt-v*,
#      与 fnos-v*/desktop-v* 同模式——二进制产物统一在主仓 Releases 可下载;
#      跨仓写用 OPENWRT_PAT,secret 未配置时本 job 失败放行(continue-on-error),
#      本地 `gh release upload` 兜底)
# workflow_dispatch: 传 version(现有 tag 名)对该版本手动重跑 ipk 打包+双挂
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: '目标版本(现有 tag 名,如 v0.1.0)。仅重跑 ipk 打包+双挂'
        required: true
        type: string

env:
  FRONTEND_REF: main   # frontend 仓未打 tag,发布时构建 main;升级钉 tag 后改这里并记录 SHA

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            goarch: amd64
          - arch: aarch64_generic
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 手动 dispatch 时按输入版本检出对应 tag,产物与 tag 严格一致
          ref: ${{ inputs.version || github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: 交叉编译(CGO_ENABLED=0,纯 Go sqlite)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build \
            -ldflags="-w -s \
            -X 'github.com/filescodebox/kit/version.Version=${{ inputs.version || github.ref_name }}' \
            -X 'github.com/filescodebox/kit/version.BuildCommit=${{ github.sha }}'" \
            -o dist/filescodebox ./cmd/filescodebox
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 前端构建 + 双格式打包(ipk + 签名 apk)
        env:
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
        run: |
          # 记录前端来源 commit,写进 Release notes(可复现性)
          FE_SHA=$(git ls-remote https://github.com/filescodebox/frontend.git "refs/heads/${FRONTEND_REF}" | cut -f1)
          echo "FE_SHA=${FE_SHA}" >> "$GITHUB_ENV"
          ./scripts/build-frontend.sh
          VERSION="${{ inputs.version || github.ref_name }}"
          ./scripts/build-ipk.sh ${{ matrix.arch }} "${VERSION#v}"
          # 签名私钥(GH secret,PEM)落盘供 mkpkg --sign-key;公钥 keys/filescodebox.pem 已入库
          echo "${APK_SIGN_KEY}" > /tmp/apk-sign.key
          APK_SIGN_KEY=/tmp/apk-sign.key ./scripts/build-apk.sh ${{ matrix.arch }} "${VERSION#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: |
            dist/filescodebox_*.ipk
            dist/filescodebox-*.apk
          retention-days: 14
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages-x86_64
          path: rel
      - uses: actions/download-artifact@v4
        with:
          name: packages-aarch64_generic
          path: rel
      - name: 挂本仓 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ github.ref_name }}
        run: |
          gh release view "${VER}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${VER}" --repo "${GITHUB_REPOSITORY}" \
              --title "FilesCodeBox OpenWrt/iStoreOS ${VER}" \
              --notes "OpenWrt/iStoreOS 原生包(见 Assets)。双格式双架构:opkg 系(22.03/23.05,含 iStoreOS 现行版)装 *_<arch>.ipk;apk3 系(25.12+)装 *-r0_<arch>.apk(先按 README 预置公钥 keys/filescodebox.pem)。前端来源: filescodebox/frontend@${{ env.FE_SHA || 'main' }}。"
          gh release upload "${VER}" rel/*.ipk rel/*.apk --repo "${GITHUB_REPOSITORY}" --clobber

  attach-to-hub:
    continue-on-error: true
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages-x86_64
          path: rel
      - uses: actions/download-artifact@v4
        with:
          name: packages-aarch64_generic
          path: rel
      - name: 回挂包到生态主仓
        env:
          GH_TOKEN: ${{ secrets.OPENWRT_PAT }}
          TAG: openwrt-${{ inputs.version || github.ref_name }}
          VER: ${{ inputs.version || github.ref_name }}
        run: |
          gh release view "${TAG}" --repo filescodebox/filescodebox >/dev/null 2>&1 || \
            gh release create "${TAG}" --repo filescodebox/filescodebox \
              --title "FilesCodeBox OpenWrt/iStoreOS ${VER}" \
              --notes "OpenWrt/iStoreOS 原生包(见 Assets)。安装说明见 openwrt 仓 README。"
          gh release upload "${TAG}" rel/*.ipk rel/*.apk --repo filescodebox/filescodebox --clobber
          echo "已回挂到 filescodebox/filescodebox Releases"
